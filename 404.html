<!doctype html>
<html lang="de">
<head>

  <title>404 | hm-clan</title>

  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    html {
      min-height: 100%;
      color: #e7dfcf;
      background:
        radial-gradient(circle at 18% 12%, rgba(184, 74, 47, 0.32), transparent 28rem),
        linear-gradient(135deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 16px),
        #0b0b0a;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 104px 24px 42px;
      text-align: center;
    }

    .brand {
      position: fixed;
      top: 18px;
      left: 18px;
      color: #e7dfcf;
      line-height: 1;
      text-decoration: none;
    }

    .brand-name {
      display: block;
      font-family: Impact, sans-serif;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: 0.04em;
    }

    .brand-tag {
      display: block;
      color: #d6a72f;
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    main {
      width: min(720px, 100%);
    }

    .code {
      color: #b84a2f;
      font-family: Impact, sans-serif;
      font-size: clamp(7rem, 24vw, 14rem);
      line-height: 0.85;
      letter-spacing: 0.02em;
      text-shadow: 6px 6px 0 rgba(214, 167, 47, 0.22);
    }

    h1 {
      margin-top: 22px;
      font-size: clamp(2rem, 8vw, 4.6rem);
      line-height: 0.98;
    }

    p {
      width: min(540px, 100%);
      margin: 18px auto 0;
      color: #aaa393;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .btn {
      display: inline-flex;
      margin-top: 30px;
      padding: 13px 20px;
      color: #050505;
      background: #d6a72f;
      border: 2px solid #d6a72f;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .btn:hover {
      background: transparent;
      color: #e7dfcf;
    }
  </style>
</head>
<body>
  <a class="brand" href="index.html" aria-label="hm-clan Home"><span class="brand-name">hm-clan</span><span class="brand-tag">history makers</span></a>
  <main>
    <div class="code">404</div>
    <h1>Beat verpasst.</h1>
    <p>Diese Seite hat sich aus dem Set geschlichen. Kein Drama: kurzer Rewind, zurück zur hm-clan-Homebase und weiter im Takt.</p>
    <a class="btn" href="index.html">Zur Startseite</a>

</html>
